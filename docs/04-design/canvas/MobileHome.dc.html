<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home on mobile · Big-Matrix HRM</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bigmatrix/components/bundle.css">
<link rel="stylesheet" href="hrm-app.css">
<script src="ds/bigmatrix/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="hrm-root" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line);">
    <img src="/_blob/1140a9458a73287affda4329b4c9a4a4" alt="Big-Matrix HRM" style="width: 32px; height: 32px; display: block;">
    <span class="hrm-label">Big-Matrix HRM</span>
    <span class="hrm-avatar" aria-label="Nusrat Jahan">NJ</span>
  </header>

  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 20px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span class="hrm-label">Thu, 22 Oct</span>
      <h1 class="hrm-h2" style="font-size: 26px;">Good morning, Nusrat</h1>
    </div>

    <section class="hrm-card hrm-brand-stage" aria-labelledby="today" style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <x-import component-from-global-scope="BigMatrix.Glow"></x-import>
      <x-import component-from-global-scope="BigMatrix.DotGrid"></x-import>
      <div class="hrm-stage-content" style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <h2 id="today" class="hrm-label" style="margin: 0;">Today</h2>
        <span class="hrm-badge tone-ok">Checked in</span>
      </div>
      <div class="hrm-stage-content" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span class="hrm-kpi" style="font-size: 40px;">2 h 15 m</span>
          <span class="hrm-muted" style="font-size: 13px;">In at <span class="hrm-mono">9:41 am</span> · web</span>
        </div>
      </div>
      <div class="hrm-stage-content" style="display: flex; flex-direction: column; gap: 6px;">
        <div class="hrm-meter" role="img" aria-label="Core hours 10:00 am to 4:00 pm, 2 of 6 hours covered"><span style="width: 33%;"></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3);"><span class="hrm-mono">10:00</span><span>Core hours</span><span class="hrm-mono">16:00</span></div>
      </div>
      <button class="hrm-stage-content hrm-btn hrm-btn-primary hrm-btn-lg hrm-btn-block" type="button">Check out</button>
    </section>

    <section aria-labelledby="bal" style="display: flex; flex-direction: column; gap: 8px;">
      <h2 id="bal" class="hrm-label" style="margin: 0;">Leave left</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div class="hrm-card hrm-card-tight" style="display: flex; flex-direction: column; gap: 4px;"><span class="hrm-kpi" style="font-size: 22px;">7</span><span class="hrm-faint" style="font-size: 12px;">Casual</span></div>
        <div class="hrm-card hrm-card-tight" style="display: flex; flex-direction: column; gap: 4px;"><span class="hrm-kpi" style="font-size: 22px;">12</span><span class="hrm-faint" style="font-size: 12px;">Sick</span></div>
        <div class="hrm-card hrm-card-tight" style="display: flex; flex-direction: column; gap: 4px;"><span class="hrm-kpi" style="font-size: 22px;">9.5</span><span class="hrm-faint" style="font-size: 12px;">Earned</span></div>
      </div>
    </section>

    <section aria-labelledby="quick" style="display: flex; flex-direction: column; gap: 8px;">
      <h2 id="quick" class="hrm-label" style="margin: 0;">Quick actions</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <a class="hrm-btn hrm-btn-secondary hrm-btn-lg" href="MobileLeave.dc.html">Request leave</a>
        <a class="hrm-btn hrm-btn-secondary hrm-btn-lg" href="#claim">Claim transport</a>
      </div>
    </section>

    <div class="hrm-alert hrm-alert-warn" role="status">
      <svg class="hrm-icon hrm-icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;"><strong style="font-weight: 600;">Missing check-out on 21 Oct</strong><a href="#correction" style="font-size: 13px;">Request a correction</a></div>
    </div>
  </main>

  <nav class="hrm-tabbar" aria-label="Main">
    <a class="is-active" href="MobileHome.dc.html" aria-current="page"><svg class="hrm-icon hrm-icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Home</a>
    <a href="#attendance"><svg class="hrm-icon hrm-icon-20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Attendance</a>
    <a href="MobileLeave.dc.html"><svg class="hrm-icon hrm-icon-20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>Leave</a>
    <a href="#claims"><svg class="hrm-icon hrm-icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path></svg>Claims</a>
    <a href="#payslips"><svg class="hrm-icon hrm-icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>Payslips</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["ink","paper"],"default":"ink","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'ink' };
  }
}
</script>
</body>
</html>
