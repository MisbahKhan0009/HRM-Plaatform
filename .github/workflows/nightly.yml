# Nightly checks (CI-CD.md §1): every journey on all engines and mobile viewports, and a dependency audit.
name: nightly

on:
  schedule:
    - cron: "30 20 * * *" # 02:30 Asia/Dhaka
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-all-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
          POSTGRES_DB: hrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: All engines and mobile viewports
        env:
          E2E_DATABASE_URL: postgres://hrm:hrm@localhost:5432/hrm_e2e
          E2E_ALL_BROWSERS: "1"
        run: |
          pnpm --filter @hrm/e2e exec playwright install --with-deps
          pnpm e2e

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level=high
