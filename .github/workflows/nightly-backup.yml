# Nightly encrypted backup of production to R2 (BACKUP-AND-RESTORE.md §3). Plaintext never leaves the runner.
name: nightly-backup

on:
  schedule:
    - cron: "0 21 * * *" # 03:00 Asia/Dhaka
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: backups
    steps:
      - name: Install pg_dump 17 and age
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - name: Dump, verify, encrypt and upload
        env:
          NEON_PROD_OWNER_URL: ${{ secrets.NEON_PROD_OWNER_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          /usr/lib/postgresql/17/bin/pg_dump "$NEON_PROD_OWNER_URL" --format=custom --no-owner --no-privileges --file="hrm-$STAMP.dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "hrm-$STAMP.dump" > /dev/null
          sha256sum "hrm-$STAMP.dump" > "hrm-$STAMP.dump.sha256"
          age -r "$BACKUP_AGE_RECIPIENT" -o "hrm-$STAMP.dump.age" "hrm-$STAMP.dump"
          rm -f "hrm-$STAMP.dump"
          aws s3 cp "hrm-$STAMP.dump.age" s3://hrm-backups/daily/ --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "hrm-$STAMP.dump.sha256" s3://hrm-backups/daily/ --endpoint-url "$R2_ENDPOINT"
          if [ "$(date -u -d '+6 hours' +%d)" = "01" ]; then
            aws s3 cp "hrm-$STAMP.dump.age" s3://hrm-backups/monthly/ --endpoint-url "$R2_ENDPOINT"
          fi
          aws s3 ls s3://hrm-backups/daily/ --endpoint-url "$R2_ENDPOINT" | grep -q "hrm-$STAMP.dump.age"
