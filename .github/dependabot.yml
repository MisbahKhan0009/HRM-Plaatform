# Keeps pinned action SHAs and npm dependencies current (CI-CD.md §5). Free on public repositories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Vitest 5 stops the API tests running in the Workers runtime with @cloudflare/vitest-plugin 1.4.3 (the newest
      # version old enough for minimumReleaseAge). Re-check when a newer plugin passes the release-age gate.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
