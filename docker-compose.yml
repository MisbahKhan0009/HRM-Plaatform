# Local development database only. Never put real employee data here (NFR-SEC-009).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: hrm
      POSTGRES_DB: hrm
    ports:
      - "5432:5432"
    volumes:
      - hrm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm"]
      interval: 5s
      retries: 10
volumes:
  hrm-db:
